<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シン・rayna.space | 宇宙哲学聖域</title>
    <style>
        /* 閣下のコードの論理を完全に補完・活性化させたスタイル */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 50%, #0a0f14, #05070a 60%);
            overflow: hidden;
            width: 100%;
            height: 100vh;
        }

        /* 背景で流動する星雲の波動 */
        .cosmic-flow {
            position: fixed;
            inset: 0;
            background: url('nebula.png');
            background-size: cover;
            opacity: 0.15;
            animation: flow 40s linear infinite;
            pointer-events: none;
        }

        @keyframes flow {
            0% { transform: scale(1) translateX(0); }
            100% { transform: scale(1.2) translateX(-5%); }
        }

        /* 閣下のコンテンツを表示するための高貴なる中央コンテナ */
        .main-gate {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            font-family: 'Times New Roman', 'Noto Serif JP', serif;
            color: #f4f5f6;
        }
    </style>
</head>
<body>

    <!-- 星雲の流動エフェクト層 -->
    <div class="cosmic-flow"></div>

    <!-- ここに閣下の思想やゲームのシステムが格納されます -->
    <div class="main-gate">
        <h1 style="color: #e2b865; letter-spacing: 0.5rem;">シン・rayna.space</h1>
        <p style="opacity: 0.8; letter-spacing: 0.2rem;">時空の歪みは修正され、秩序は復元せり。</p>
    </div>

</body>
</html>
